<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3b5c">
<title>Transferências bb básico</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#5b6675;--li:#dde3ea;--pri:#1f3b5c;--pri2:#2d5584;--ok:#1e7b34;--okbg:#e6f4ea;--er:#b3261e;--erbg:#fdecea;--av:#9a5b00;--avbg:#fff4e0;--chip:#eef2f6}
@media (prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1a2129;--tx:#e8edf2;--mu:#9aa7b5;--li:#2c3640;--pri:#8fb4e0;--pri2:#a9c6ea;--ok:#6fd08a;--okbg:#17321f;--er:#ff8a80;--erbg:#3a1b19;--av:#f2b45a;--avbg:#3a2a12;--chip:#232c36}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:14px 16px 10px}
@media (prefers-color-scheme:dark){header{background:#1f3b5c}}
header .marca{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
header h1{margin:2px 0 0;font-size:22px}
header .sub{font-size:13px;opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--li);position:sticky;top:0;z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--li);background:var(--chip);color:var(--tx);border-radius:999px;padding:8px 12px;font:inherit;font-size:15px;font-weight:600}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){nav button.on{color:#11161c}}
nav .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--er);color:#fff;font-size:12px;line-height:20px;text-align:center}
main{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--li);border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:14px 0 6px;font-size:15px}
.mu{color:var(--mu);font-size:14px}
.vazio{color:var(--mu);text-align:center;padding:28px 10px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--li)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.item .ds{font-weight:600}
.item .ct{font-size:20px;font-weight:700;min-width:64px;text-align:right}
.item.ok .ct{color:var(--ok)}
.tam{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;font-weight:700;margin-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;background:var(--pri);color:#fff;min-height:48px}
@media (prefers-color-scheme:dark){.btn{color:#11161c}}
.btn.sec{background:var(--chip);color:var(--tx);border:1px solid var(--li)}
.btn.ok{background:var(--ok);color:#fff}
.btn.pq{min-height:36px;padding:6px 10px;font-size:14px;font-weight:600}
.btn:disabled{opacity:.45}
.lin{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lin>*{flex:1 1 auto}
.item .lin>*{flex:0 0 auto}
input,textarea,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--li);background:var(--card);color:var(--tx);min-height:46px;width:100%}
textarea{min-height:80px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.aviso{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:15px}
.aviso.er{background:var(--erbg);color:var(--er)}
.aviso.av{background:var(--avbg);color:var(--av)}
.aviso.ok{background:var(--okbg);color:var(--ok)}
.barra{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 2px}
.barra i{display:block;height:100%;background:var(--ok)}
.scan{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.scan[hidden]{display:none}
.scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan .mira{position:absolute;left:10%;right:10%;top:32%;height:18%;border:3px solid rgba(255,255,255,.8);border-radius:12px;pointer-events:none}
.scanbar{background:#111;color:#fff;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.fb{border-radius:12px;padding:14px;margin-bottom:10px;font-size:18px;font-weight:700;text-align:center;background:#2a2f36}
.fb.ok{background:#1e7b34}.fb.er{background:#b3261e}.fb.av{background:#9a5b00}
.fb small{display:block;font-size:15px;font-weight:600;opacity:.95;margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:16px;z-index:60;display:none;padding:14px;border-radius:12px;font-weight:600;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--li);vertical-align:top}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em;border-top:0}
.tabw{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip)}
.pill.er{background:var(--erbg);color:var(--er)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.av{background:var(--avbg);color:var(--av)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.param{display:grid;grid-template-columns:1fr 110px 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--li)}
.param input{min-height:40px;padding:6px 8px}
.prest{display:grid;grid-template-columns:1fr 1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--li)}
.prest input{min-height:40px;padding:6px 8px}.prest .pill{grid-column:1/-1;justify-self:start}
@media (max-width:420px){.param{grid-template-columns:1fr 90px 74px}}
</style>
</head>
<body>
<header><div class="marca">bb básico · transferências entre lojas</div><h1 id="titulo">Carregando…</h1><div class="sub" id="sub"></div></header>
<nav id="abas" hidden></nav>
<main id="conteudo"><div class="vazio">Carregando…</div></main>
<div id="scan" class="scan" hidden>
  <video id="scanv" playsinline muted></video><div class="mira"></div>
  <div class="scanbar"><div id="scanfb" class="fb">Aponte para o código de barras da etiqueta</div><button class="btn sec" id="scanx" style="width:100%">Fechar câmera</button></div>
</div>
<div id="toast"></div>
<script>
var EXEC = "https://script.google.com/macros/s/AKfycbyBi659H2-n8E2D-PRBoUz319O5oGC3IAdH-cI3wCLDn0rWJZcvbWyfJneH1jRHYGK2NQ/exec";
var TOK = (location.hash.match(/t=([^&]+)/) || [])[1] || '';
var EST = null, PAINEL = null, FRANQ = null, FRANQ_ADM = null, ABA = null, LOJA_ADM = null, OCUP = false, SIMUL = null, NAO = null, BUSCA = null, FORN_ADM = null;
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dt(d) { d = String(d || '').slice(0, 10); return d ? d.slice(8, 10) + '/' + d.slice(5, 7) : ''; }
// a data padrão vem do servidor (horário de Brasília), não do relógio do celular
function hojeISO() { if (EST && EST.hoje) return EST.hoje; var d = new Date(Date.now() - 3 * 3600e3); return d.toISOString().slice(0, 10); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem('bbt_' + k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem('bbt_' + k); else localStorage.setItem('bbt_' + k, JSON.stringify(v)); } catch (e) { } }
function toast(m, tipo) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; t.style.background = tipo == 'er' ? 'var(--er)' : (tipo == 'ok' ? 'var(--ok)' : '#333'); t.style.color = '#fff'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, tipo == 'er' ? 6000 : 3000); }
function api(acao, dados) {
  var b = Object.assign({ tok: TOK, acao: acao }, dados || {}); if (LOJA_ADM) b.loja = LOJA_ADM; if (FRANQ_ADM) b.franq = FRANQ_ADM; if (FORN_ADM && !b.forn) b.forn = FORN_ADM;
  return fetch(EXEC, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) })
    .then(function (r) { return r.json(); }).then(function (o) { if (!o.ok) throw new Error(o.erro || 'erro'); return o; });
}
function acao(nome, dados, msgOk) {
  if (OCUP) return Promise.resolve(); OCUP = true; document.body.style.cursor = 'progress';
  return api(nome, dados).then(function (o) { if (o.estado) EST = o.estado; if (o.painel) PAINEL = o.painel; if (o.franq) FRANQ = o.franq; render(); if (o.msg || msgOk) toast(o.msg || msgOk, 'ok'); return o; })
    .catch(function (e) { toast(e.message, 'er'); }).then(function (o) { OCUP = false; document.body.style.cursor = ''; return o; });
}

// ---------- código da etiqueta (mesma tolerância do servidor e do CRM) ----------
function codigos(c) { c = String(c || '').replace(/\D/g, ''); if (!c) return []; var a = c.replace(/^0+/, '') || '0', o = [a]; if (c.length == 12 || c.length == 14) { var b = c.slice(0, -1).replace(/^0+/, '') || '0'; if (o.indexOf(b) < 0) o.push(b); } return o; }
function casa(c, sku) { return codigos(c).indexOf(String(sku).replace(/^0+/, '') || '0') >= 0; }
function nomeIt(i) { return [i.descricao, i.cor].filter(Boolean).join(' · '); }

// ---------- som e vibração ----------
var AC = null;
function bip(ok) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(AC.destination); g.gain.value = .15; o.start(); o.stop(AC.currentTime + (ok ? .09 : .35)); } catch (e) { } try { navigator.vibrate && navigator.vibrate(ok ? 60 : [120, 60, 120]); } catch (e) { } }

// ---------- câmera (Android: leitor do Chrome; iPhone: ZXing, igual ao CRM) ----------
var SCAN = null;
function carregaZx() { if (window.ZXing) return Promise.resolve(); return new Promise(function (ok, nok) { var s = document.createElement('script'); s.src = '/bb-voz/zxing.min.js'; s.onload = ok; s.onerror = function () { nok(new Error('leitor')); }; document.head.appendChild(s); }); }
function fb(txt, sub, tipo) { var f = $('scanfb'); f.className = 'fb ' + (tipo || ''); f.innerHTML = esc(txt) + (sub ? '<small>' + esc(sub) + '</small>' : ''); }
function fechaScanner() { var s = SCAN; SCAN = null; $('scan').hidden = true; if (!s) return; try { s.zx && s.zx.reset(); } catch (e) { } try { (s.st || $('scanv').srcObject).getTracks().forEach(function (t) { t.stop(); }); } catch (e) { } $('scanv').srcObject = null; render(); }
function abreScanner(cb) {
  $('scan').hidden = false; fb('Aponte para o código de barras da etiqueta'); var me = SCAN = { cb: cb, ult: '', quando: 0 }, v = $('scanv');
  function lido(c) { if (SCAN !== me || !c) return; var t = Date.now(); if (c == me.ult && t - me.quando < 1500) return; if (t - me.quando < 700) return; me.ult = c; me.quando = t; me.cb(String(c)); }
  function erro(m) { if (SCAN === me) fb(m, '', 'er'); }
  if (window.BarcodeDetector) {
    (BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats() : Promise.resolve(['ean_13', 'code_128'])).then(function (fs) {
      var bd = new BarcodeDetector({ formats: fs.filter(function (f) { return ['ean_13', 'ean_8', 'code_128', 'code_39', 'itf', 'upc_a', 'upc_e', 'codabar'].indexOf(f) >= 0; }) });
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (st) {
        if (SCAN !== me) { st.getTracks().forEach(function (t) { t.stop(); }); return; } me.st = st; v.srcObject = st;
        return v.play().then(function () { (function loop() { if (SCAN !== me) return; bd.detect(v).then(function (l) { if (l && l.length) lido(l[0].rawValue); setTimeout(loop, 120); }).catch(function () { setTimeout(loop, 300); }); })(); });
      });
    }).catch(function (e) { erro('Não consegui abrir a câmera (' + (e && e.name || 'erro') + '). Permita a câmera para este site ou digite o código.'); });
    return;
  }
  carregaZx().then(function () { if (SCAN !== me) return; var rd = new ZXing.BrowserMultiFormatReader(); me.zx = rd; return rd.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } }, audio: false }, v, function (r) { if (r) lido(r.getText()); }); })
    .catch(function (e) { erro('Não consegui ler com a câmera (' + (e && (e.name || e.message) || 'erro') + '). Digite o código.'); });
}
$('scanx').onclick = fechaScanner;

// ---------- abas da loja ----------
function abasLoja() {
  var e = EST;
  if (e.modo == 'contagem') return [['contar', 'Contar', e.contar.length]]; // loja da rede: só a contagem
  if (!e.lancar) { e.lancar = (e.enviar || []).filter(function (l) { return l.status == 'de_acordo'; }); e.sair = (e.enviar || []).filter(function (l) { return l.status == 'romaneio'; }); e.saidas = []; e.prestadores = []; }
  return [['separar', 'Separar', e.separar.reduce(function (s, l) { return s + l.itens.length; }, 0)], ['lancar', 'Lançar no sistema', e.lancar.length], ['sair', 'Saída da loja', e.sair.length], ['receber', 'Receber', e.receber.length], ['contar', 'Contar', e.contar.length]];
}
function render() {
  if (FRANQ && (FRANQ_ADM || !PAINEL)) return renderFranq();
  if (PAINEL && !LOJA_ADM && !FORN_ADM) return renderPainel();
  if (!EST) return;
  if (EST.modo == 'fornecedor') return renderForn(); // v2.8: link do fornecedor
  document.querySelector('.marca').textContent = EST.modo == 'contagem' ? 'bb básico · contagem de estoque' : 'bb básico · transferências entre lojas';
  $('titulo').textContent = EST.nome + (LOJA_ADM ? ' (vista do painel)' : '');
  $('sub').textContent = 'Hoje, ' + dt(EST.hoje);
  var ab = abasLoja();
  if (!ABA) { ABA = (ab.filter(function (a) { return a[2] > 0; })[0] || ab[0])[0]; }
  $('abas').hidden = false;
  $('abas').innerHTML = (LOJA_ADM ? '<button data-ab="painel">← Painel</button>' : '') + ab.map(function (a) { return '<button data-ab="' + a[0] + '" class="' + (ABA == a[0] ? 'on' : '') + '">' + a[1] + (a[2] ? '<span class="n">' + a[2] + '</span>' : '') + '</button>'; }).join('');
  var h = (EST.avisos || []).map(function (m) { return '<div class="aviso er">' + esc(m) + '</div>'; }).join('');
  h += { separar: hSeparar, lancar: hLancar, sair: hSaida, receber: hReceber, contar: hContar }[ABA]();
  $('conteudo').innerHTML = h;
}
$('abas').onclick = function (e) { var b = e.target.closest('[data-ab]'); if (!b) return; if (b.dataset.ab == 'painel') { LOJA_ADM = null; FRANQ_ADM = null; FORN_ADM = null; FRANQ = null; EST = null; ABA = null; FABA = null; $('abas').hidden = true; return carrega(); } if (EST && EST.modo == 'fornecedor') FABA = b.dataset.ab; else ABA = b.dataset.ab; render(); };

// ---------- Separar ----------
function prog(L) { var p = lsGet('lote_' + L.id) || { cont: {}, bip: [] }; L.itens.forEach(function (i) { if (p.cont[i.id] > i.qtd) p.cont[i.id] = i.qtd; }); return p; }
function hSeparar() {
  var acum = (EST.acumulando || []).map(function (a) { return '<div class="mu">Na fila para ' + esc(a.paraNome) + ': ' + a.pecas + (a.pecas == 1 ? ' peça' : ' peças') + ' (desde ' + dt(a.desde) + '). Sai um lote de até ' + a.lote + ' peças por vez, primeiro o que mais vende.</div>'; }).join('');
  if (!EST.separar.length) return '<div class="card"><div class="vazio">Nenhum lote para separar hoje.</div>' + acum + '</div>';
  return EST.separar.map(function (L) {
    var p = prog(L), tot = 0, ok = 0;
    L.itens.forEach(function (i) { tot += i.qtd; ok += Math.min(p.cont[i.id] || 0, i.qtd); });
    var completo = ok == tot && tot > 0;
    return '<div class="card" data-lote="' + L.id + '"><h2>Para ' + esc(L.paraNome) + '</h2><div class="mu">Liberado em ' + dt(L.liberado_em) + ' · ' + tot + ' peças. Bipe cada peça antes de fazer a transferência no sistema.</div>'
      + '<div class="barra"><i style="width:' + (tot ? Math.round(100 * ok / tot) : 0) + '%"></i></div><div class="mu">' + ok + ' de ' + tot + ' bipadas</div>'
      + '<div class="lin"><button class="btn" data-bipar="' + L.id + '">📷 Bipar peças</button></div>'
      + '<div class="lin"><input data-cod="' + L.id + '" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
      + L.itens.map(function (i) { var c = p.cont[i.id] || 0; return '<div class="item' + (c >= i.qtd ? ' ok' : '') + '"><div class="nm"><div class="ds">' + esc(nomeIt(i)) + '</div><div><span class="tam">' + esc(i.tamanho) + '</span><span class="mu">ref ' + esc(i.ref) + '</span></div>'
        + (i.estq != null ? '<div class="mu">Mandar ' + i.qtd + ' · <b>no sistema em ' + dt(i.estq_data) + ': ' + i.estq + '</b></div>' : '')
        + '<div class="lin" style="margin-top:6px">' + (c > 0 ? '<button class="btn sec pq" data-menos="' + i.id + '">− 1</button>' : '') + (c < i.qtd ? '<button class="btn sec pq" data-nao="' + i.id + '">Não encontrei</button>' : '') + '</div>'
        + (NAO == i.id && c < i.qtd ? hNaoEncontrei(i, c) : '') + '</div><div class="ct">' + c + ' / ' + i.qtd + '</div></div>'; }).join('')
      + '<div class="lin"><button class="btn ok" data-acordo="' + L.id + '"' + (completo ? '' : ' disabled') + '>De acordo: tudo conferido</button></div>'
      + (completo ? '' : '<div class="mu" style="margin-top:6px">O "de acordo" libera quando todas as peças forem bipadas.</div>') + '</div>';
  }).join('') + (acum ? '<div class="card">' + acum + '</div>' : '');
}
// "Não encontrei" (v2.4): antes de abrir contagem, a loja diz quantas vendeu e quantas tem; se a venda explica, não conta.
function ontemDe(d) { var x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); }
function hNaoEncontrei(i, c) {
  var pVenda = i.estq_data && i.estq_data != ontemDe(hojeISO()) ? 'Quantas dessa peça a loja vendeu depois de ' + dt(i.estq_data) + ' (até agora)?' : 'Quantas dessa peça a loja vendeu hoje?';
  return '<div class="aviso av" style="margin:8px 0 0">Antes de abrir contagem: o sistema mostra o estoque de ' + dt(i.estq_data) + (i.estq != null ? ' (' + i.estq + ')' : '') + ', sem as vendas de hoje.'
    + '<label>' + esc(pVenda) + '</label><input data-nv="' + i.id + '" inputmode="numeric" placeholder="0 se nenhuma">'
    + '<label>Quantas a loja tem dessa peça agora, contando vitrine, arara e estoque' + (c ? ' (inclua as ' + c + ' já bipadas)' : '') + '?</label><input data-na="' + i.id + '" inputmode="numeric" placeholder="0 se nenhuma">'
    + '<div class="lin"><button class="btn" data-nok="' + i.id + '">Registrar</button><button class="btn sec" data-nx="1" style="flex:0 0 auto">Cancelar</button></div></div>';
}
function lidoSeparar(L, code) {
  var p = prog(L), it = L.itens.filter(function (i) { return casa(code, i.sku); })[0];
  if (!it) {
    p.bip.push({ c: code, sku: '', r: 'errada' }); lsSet('lote_' + L.id, p); bip(false);
    fb('PEÇA ERRADA', 'Não está neste lote. Não envie.', 'er');
    api('produto', { codigo: code }).then(function (o) { if (SCAN && o.produto && o.produto.achou) fb('PEÇA ERRADA', o.produto.descricao + ' ' + o.produto.cor + ' ' + o.produto.tamanho + ': não está neste lote.', 'er'); }).catch(function () { });
    return;
  }
  var c = p.cont[it.id] || 0;
  if (c >= it.qtd) { p.bip.push({ c: code, sku: it.sku, r: 'excesso' }); lsSet('lote_' + L.id, p); bip(false); fb('A MAIS', nomeIt(it) + ' ' + it.tamanho + ': já tem ' + it.qtd + '. Não envie esta.', 'av'); return; }
  p.cont[it.id] = c + 1; p.bip.push({ c: code, sku: it.sku, r: 'ok' }); lsSet('lote_' + L.id, p); bip(true);
  fb('OK · ' + it.tamanho, nomeIt(it) + ' — ' + (c + 1) + ' de ' + it.qtd, 'ok');
  if (!SCAN) render();
}
function lotePorId(id) { return EST.separar.filter(function (l) { return l.id == id; })[0]; }

// ---------- Lançar no sistema e Saída da loja (v2.5): são duas coisas diferentes ----------
function hPecas(L) { return '<details><summary>Peças</summary>' + L.itens.map(function (i) { return '<div class="item"><div class="nm"><div class="ds">' + esc(nomeIt(i)) + '</div><span class="tam">' + esc(i.tamanho) + '</span></div><div class="ct">' + i.qtd_bipada + '</div></div>'; }).join('') + '</details>'; }
function pcs(L) { return L.itens.reduce(function (s, i) { return s + i.qtd_bipada; }, 0); }
function hBusco(L) { return L.busca ? '<div class="aviso ok" style="margin-top:8px"><b>O Raphael vai buscar este lote.</b> Não chame o motoboy.</div>' : ''; }
function hLancar() {
  var h = '<div class="card"><div class="mu"><b>Lançar no sistema não é enviar.</b> Aqui você só faz a transferência no sistema e anota o romaneio. Quando a mercadoria sair da loja de verdade, a baixa é na aba <b>Saída da loja</b>.</div></div>';
  if (!EST.lancar.length) return h + '<div class="card"><div class="vazio">Nada para lançar no sistema.</div></div>';
  return h + EST.lancar.map(function (L) {
    return '<div class="card"><h2>Para ' + esc(L.paraNome) + '</h2><div class="mu">' + pcs(L) + ' peças conferidas em ' + dt(L.de_acordo_em) + '</div>' + hBusco(L)
      + '<label>Faça a transferência no sistema e digite o número do romaneio</label><div class="lin"><input data-rom="' + L.id + '" inputmode="numeric" placeholder="número do romaneio"><button class="btn" data-romok="' + L.id + '" style="flex:0 0 auto">Salvar</button></div>'
      + hPecas(L) + '</div>';
  }).join('');
}

    var op = (EST.prestadores || []).map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('');
    return '<div class="card" data-saida="' + L.id + '"><h2>Para ' + esc(L.paraNome) + '</h2><div class="mu">' + pcs(L) + ' peças · romaneio ' + esc(L.romaneio) + '</div>'
      + '<div class="aviso av" style="margin-top:8px"><b>Lançado no sistema' + (L.romaneio_em ? ' em ' + dt(L.romaneio_em) : '') + '. A mercadoria ainda está na loja.</b> Dê a baixa abaixo só quando ela sair.</div>' + hBusco(L)
      + '<label>Quem levou?</label><select data-lev="' + L.id + '"><option value="">Escolha…</option><option value="motoboy">Motoboy</option><option value="raphael"' + (L.busca ? ' selected' : '') + '>Raphael</option><option value="outro">Outra pessoa</option></select>'

      + '<label>A entrega teve custo?</label><select data-cst="' + L.id + '"><option value="">Escolha…</option><option value="sim">Sim</option><option value="nao">Não</option></select>'

      + '<div class="lin"><button class="btn ok" data-saiu="' + L.id + '">Saiu da loja</button></div>' + hPecas(L) + '</div>';
  }).join('');
  if ((EST.saidas || []).length) h += '<div class="card"><h2>Já saíram</h2><div class="mu">Esperando a outra loja confirmar que recebeu. Se marcou por engano e a mercadoria ainda está aqui, desfaça.</div>'
    + EST.saidas.map(function (L) { return '<div class="item"><div class="nm"><div class="ds">Para ' + esc(L.paraNome) + ' · ' + pcs(L) + ' peças</div><div class="mu">Romaneio ' + esc(L.romaneio) + ' · saiu em ' + dt(L.enviado_em) + (L.levou ? ' com ' + esc(L.levou) : '') + '</div></div><button class="btn sec pq" data-desf="' + L.id + '">Marquei errado</button></div>'; }).join('') + '</div>';

// mostra só as perguntas que valem para quem levou
function ajustaSaida(card) {
  var q = function (a) { return card.querySelector(a); }, lev = q('[data-lev]').value, bx = function (n, v) { q('[data-bx="' + n + '"]').hidden = !v; };
  bx('outro', lev == 'outro'); bx('motoboy', lev == 'motoboy'); bx('novo', q('[data-prs]').value == '__novo'); bx('valor', q('[data-cst]').value == 'sim');

$('conteudo').addEventListener('change', function (e) { var c = e.target.closest('[data-saida]'); if (c && e.target.tagName == 'SELECT') ajustaSaida(c); });

// ---------- Receber: lotes a confirmar + situação de tudo que vem para a loja ----------
function hReceber() {
  var h = EST.receber.length ? EST.receber.map(function (L) {
    var pc = L.itens.reduce(function (s, i) { return s + i.qtd_bipada; }, 0);
    return '<div class="card"><h2>Do ' + esc(L.deNome) + '</h2><div class="mu">Romaneio ' + esc(L.romaneio) + ' · saiu de lá em ' + dt(L.enviado_em) + (L.levou ? ' com ' + esc(L.levou) : '') + ' · ' + pc + ' peças</div>'
      + '<details><summary>Peças</summary>' + L.itens.map(function (i) { return '<div class="item"><div class="nm"><div class="ds">' + esc(nomeIt(i)) + '</div><span class="tam">' + esc(i.tamanho) + '</span></div><div class="ct">' + i.qtd_bipada + '</div></div>'; }).join('') + '</details>'
      + '<label>Dia em que chegou</label><input type="date" data-recd="' + L.id + '" value="' + hojeISO() + '" max="' + hojeISO() + '">'
      + '<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" data-dif="' + L.id + '" style="width:22px;min-height:22px"> Chegou diferente</label>'
      + '<textarea data-obs="' + L.id + '" placeholder="O que veio diferente? (opcional)" hidden></textarea>'
      + '<div class="lin"><button class="btn ok" data-rec="' + L.id + '">Recebido</button></div><div class="mu" style="margin-top:6px">Dê a entrada no sistema normalmente. Aqui é só para registrar que chegou.</div></div>';
  }).join('') : '<div class="card"><div class="vazio">Nenhum lote a caminho para confirmar.</div></div>';
  return h + hBusca() + hForaDoApp() + hSituacao(); // lotes a confirmar primeiro (é a ação do dia)
}
// Busca (v2.4): a gerente procura se uma peça está vindo para a loja (pelo app ou por transferência já feita no sistema).
function hBusca() {
  var h = '<div class="card"><h2>Essa peça está vindo?</h2><div class="mu">Digite a referência ou bipe a etiqueta.</div>'
    + '<div class="lin"><input data-busca="1" inputmode="numeric" placeholder="referência ou código" value="' + esc(BUSCA ? BUSCA.texto : '') + '"><button class="btn" data-bus="1" style="flex:0 0 auto">Buscar</button><button class="btn sec" data-buscam="1" style="flex:0 0 auto">📷</button></div>';
  if (BUSCA) {
    if (!BUSCA.achou) h += '<div class="aviso er" style="margin-top:8px">' + esc(BUSCA.msg || 'Não encontrado.') + '</div>';
    else {
      var nome = BUSCA.produto ? [BUSCA.produto.descricao, BUSCA.produto.cor, BUSCA.produto.tamanho].join(' ') : 'ref ' + BUSCA.ref;
      var lin = function (x, extra) { return '<div class="item"><div class="nm"><div class="ds">' + esc([x.descricao, x.cor].filter(Boolean).join(' · ')) + '</div><div><span class="tam">' + esc(x.tamanho) + '</span><span class="mu">do ' + esc(x.deNome) + ' · ' + esc(extra) + '</span></div></div><div class="ct">' + x.qtd + '</div></div>'; };
      if (!BUSCA.app.length && !BUSCA.sistema.length) h += '<div class="aviso av" style="margin-top:8px">Nada previsto para a sua loja: ' + esc(nome) + '.</div>';
      if (BUSCA.app.length) h += '<h3>Pedido pelo app (' + esc(nome) + ')</h3>' + BUSCA.app.map(function (x) { return lin(x, x.etapa + (x.romaneio ? ' · romaneio ' + x.romaneio : '') + (x.tipo ? ' · ' + x.tipo : '')); }).join('');
      if (BUSCA.sistema.length) h += '<h3>Transferência feita no sistema, ainda sem entrada</h3>' + BUSCA.sistema.map(function (x) { return lin(x, 'romaneio ' + x.romaneio + ' · saída ' + dt(x.saida)); }).join('');
    }
  }
  return h + '</div>';
}
function buscar(txt) { txt = String(txt || '').trim(); if (!txt) return; return api('busca', { texto: txt }).then(function (o) { BUSCA = o.busca; render(); }).catch(function (e) { toast(e.message, 'er'); }); }
// Transferências feitas fora do app para esta loja, ainda sem entrada (v2.4).
function hForaDoApp() {

  if (!f.length) return '';
  return '<div class="card"><h2>Transferências feitas fora do app</h2><div class="mu">Saíram para a sua loja pelo sistema, sem passar pelo app. Ficam aqui até a entrada aparecer no sistema.</div>'
    + f.map(function (x) { return '<div class="item"><div class="nm"><div class="ds">Romaneio ' + esc(x.romaneio) + ' · do ' + esc(x.deNome) + '</div><div class="mu">' + esc(x.detalhe) + '</div></div></div>'; }).join('') + '</div>';
}
var COR_GRUPO = { enviado: 'ok', transporte: 'ok', conferido: '', separacao: '', solicitado: '', nao_encontrado: 'er', cancelado: 'av', recebido: 'ok' };
function hSituacao() {
  var g = EST.aReceber || [];

  return '<div class="card"><h2>O que vem para a sua loja</h2><div class="mu">Cada peça pedida para cá e em que etapa está.</div>' + g.map(function (x) {
    return '<details data-grupo="' + x.grupo + '"' + (x.grupo == 'enviado' || x.grupo == 'nao_encontrado' ? ' open' : '') + '><summary><span class="pill ' + (COR_GRUPO[x.grupo] || '') + '">' + esc(x.rotulo) + '</span> ' + x.pecas + (x.pecas == 1 ? ' peça' : ' peças') + '</summary>'

      + x.itens.map(function (i) {

      }).join('') + '</details>';
  }).join('') + '</div>';
}

// ---------- Contar (duas etapas: 1. física, pela peça; 2. bipagem da etiqueta) ----------
function progC(C) { var p = lsGet('cont_' + C.id) || {}; p.passo = p.passo || 1; p.fis = p.fis || {}; p.eti = p.eti || {}; p.outros = p.outros || []; p.bip = p.bip || []; return p; }
function somaObj(o) { return Object.keys(o).reduce(function (s, k) { return s + (o[k] || 0); }, 0); }
// Loja da rede (só contagem): aviso da carga e a contagem livre (bipa qualquer peça e abre a cor dela).
function hRedeTopo() {
  if (EST.modo != 'contagem') return '';
  if (EST.parada) return '<div class="card"><div class="aviso er"><b>Contagem suspensa.</b> O sistema desta loja não manda dados para o app ' + (EST.carga_ate ? 'desde ' + dt(EST.carga_ate) : 'ainda') + '. Contar agora compararia com saldo velho. A contagem volta sozinha quando a carga voltar.</div></div>';
  return '<div class="card"><h2>Contar outra peça</h2><div class="mu">Além da lista abaixo, você pode contar qualquer produto: bipe ou digite o código da etiqueta de uma peça e o app abre a contagem daquela cor.</div>'
    + '<div class="lin"><button class="btn" data-livrecam="1">📷 Bipar etiqueta</button></div>'
    + '<div class="lin"><input data-livre="1" inputmode="numeric" placeholder="ou digite o código"><button class="btn sec" data-livreok="1" style="flex:0 0 auto">Abrir contagem</button></div></div>';
}
function hContar() {
  if (!EST.contar.length) return hRedeTopo() + (EST.parada ? '' : '<div class="card"><div class="vazio">Nenhuma contagem pendente.</div></div>');
  return hRedeTopo() + EST.contar.map(function (C) {
    var p = progC(C), d = (C.grade[0] || {}).descricao || '', tf = somaObj(p.fis), te = somaObj(p.eti) + p.outros.length;
    var h = '<div class="card"><h2>Contar: ' + esc(d) + '</h2>' + (C.motivo ? '<div class="mu"><b>' + esc(C.motivo) + '</b></div>' : '') + '<div class="mu">Ref ' + esc(C.ref) + ' · ' + (C.etapa == 'cor' ? 'todos os tamanhos da cor ' + esc(C.cor) : 'a referência inteira, todas as cores') + '. Conte a loja e o estoque.</div>';
    if (p.passo == 1) {
      h += '<div class="aviso av" style="margin-top:10px"><b>Passo 1 de 2 · Contagem física.</b> Pegue cada peça e conte pela cor e pelo tamanho da própria roupa. Não bipe agora.</div>'
        + (EST.modo == 'contagem' ? '<div class="aviso ok"><b>Conte a loja e o estoque inteiros.</b> Só fica de fora caixa de mercadoria que chegou e ainda não teve a entrada lançada no sistema.</div>'
          : '<div class="aviso ok"><b>Não abra saco de transferência já conferido.</b> O que já foi bipado e está no saco o app já sabe: conte só o que está fora dos sacos. Mercadoria que chegou de outra loja conta normalmente (marque "Recebido" na aba Receber).</div>')
        + C.grade.map(function (g) { var n = p.fis[g.sku] || 0; return '<div class="item"><div class="nm"><div class="ds">' + esc(g.cor) + '</div><span class="tam">' + esc(g.tamanho) + '</span></div><button class="btn sec pq" data-cm="' + C.id + '|' + g.sku + '">−</button><div class="ct" style="min-width:40px;text-align:center">' + n + '</div><button class="btn sec pq" data-cp="' + C.id + '|' + g.sku + '">+</button></div>'; }).join('')
        + '<div class="lin"><button class="btn" data-cfim="' + C.id + '">Concluir contagem física (' + tf + ' peças)</button></div>';
    } else if (p.passo == 4) {
      var tv = somaObj(p.ven || {});
      var linV = function (g, mais) { var n = (p.ven || {})[g.sku] || 0; return '<div class="item"><div class="nm"><div class="ds">' + esc(g.cor) + '</div><span class="tam">' + esc(g.tamanho) + '</span></div><button class="btn sec pq" data-vm="' + C.id + '|' + g.sku + '">−</button><div class="ct" style="min-width:40px;text-align:center">' + n + '</div>' + (mais ? '<button class="btn sec pq" data-vp="' + C.id + '|' + g.sku + '">+</button>' : '') + '</div>'; };
      h += '<div class="aviso av" style="margin-top:10px"><b>Última pergunta · Vendas.</b> O sistema que o app enxerga vai até ' + dt(C.saldo_data) + '. <b>Vendeu alguma peça desta cor depois disso, contando hoje até agora?</b> Pegue as boletas de venda desse período e leia com o celular a etiqueta colada em cada boleta. O app separa sozinho o que é desta cor. Sem isso a conta não fecha.</div>'
        + '<div class="lin"><button class="btn" data-vbipar="' + C.id + '">📷 Ler a etiqueta da boleta</button></div>'
        + (p.vman ? '<div class="mu" style="margin-top:10px"><b>Etiqueta rasgada ou que não lê:</b> digite o código que está na boleta, ou marque no + do tamanho.</div>'
            + '<div class="lin"><input data-vcod="' + C.id + '" inputmode="numeric" placeholder="código do item e Enter"></div>' + C.grade.map(function (g) { return linV(g, true); }).join('')
          : (tv ? '<div class="mu" style="margin-top:10px"><b>Vendidas lidas das boletas</b> (toque no − se leu a mesma boleta duas vezes)</div>' + C.grade.filter(function (g) { return (p.ven || {})[g.sku]; }).map(function (g) { return linV(g, false); }).join('') : '')
            + '<div class="lin"><button class="btn sec" data-vman="' + C.id + '">Etiqueta rasgada ou que não lê? Digitar o código</button></div>')
        + '<div class="lin">' + (tv ? '<button class="btn ok" data-vsim="' + C.id + '">Registrar: vendeu ' + tv + (tv == 1 ? ' peça' : ' peças') + '</button>' : '<button class="btn ok" data-vnao="' + C.id + '">Não vendeu nenhuma · registrar</button>') + '<button class="btn sec" data-vvolta="' + C.id + '" style="flex:0 0 auto">Voltar</button></div>';
    } else if (p.passo == 3) {
      var dv = divContagem(C, p);
      h += '<div class="aviso er" style="margin-top:10px"><b>Conferir antes de registrar.</b> A contagem pela peça e as etiquetas não bateram nos tamanhos abaixo. Reconte só esses tamanhos: pegue cada peça, olhe o tamanho na roupa e na etiqueta, e corrija os números.</div>'
        + dv.map(function (x) {
          if (x.outros) return '<div class="item"><div class="nm"><div class="ds">Etiquetas de outros produtos</div><span class="mu">' + esc(p.outros.join(', ')) + '</span></div><button class="btn sec pq" data-cmo="' + C.id + '">− 1</button><div class="ct">' + p.outros.length + '</div></div>';
          var g = x.g, nf = p.fis[g.sku] || 0, ne = p.eti[g.sku] || 0;

            + '<div class="lin" style="margin-top:4px"><span class="mu">Etiquetas:</span>' + (ne ? '<button class="btn sec pq" data-cmb="' + C.id + '|' + g.sku + '">− 1</button>' : '') + '<b>' + ne + '</b></div></div></div>';
        }).join('')
        + '<div class="lin"><button class="btn" data-cbipar="' + C.id + '">📷 Bipar etiqueta</button></div>'
        + '<div class="lin"><input data-ccod="' + C.id + '" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
        + (dv.length ? '<div class="aviso av" style="margin-top:8px">Se a diferença continuar, a peça está com a etiqueta errada: separe essas peças para trocar a etiqueta e registre assim mesmo.</div>' : '<div class="aviso ok" style="margin-top:8px">Agora bateu tudo.</div>')
        + '<div class="lin"><button class="btn ok" data-creg="' + C.id + '">Registrar contagem</button></div>';
    } else {
      h += '<div class="aviso ok" style="margin-top:10px">Passo 1 concluído: ' + tf + (tf == 1 ? ' peça contada.' : ' peças contadas.') + '</div><div class="aviso av"><b>Passo 2 de 2 · Bipagem.</b> Agora bipe a etiqueta de cada peça contada.</div>'
        + '<div class="lin"><button class="btn" data-cbipar="' + C.id + '">📷 Bipar etiquetas</button></div>'
        + '<div class="lin"><input data-ccod="' + C.id + '" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
        + C.grade.map(function (g) { var n = p.eti[g.sku] || 0; return '<div class="item"><div class="nm"><div class="ds">' + esc(g.cor) + '</div><span class="tam">' + esc(g.tamanho) + '</span></div>' + (n ? '<button class="btn sec pq" data-cmb="' + C.id + '|' + g.sku + '">− 1</button>' : '') + '<div class="ct">' + n + '</div></div>'; }).join('')
        + (p.outros.length ? '<div class="item"><div class="nm"><div class="ds">Etiquetas de outros produtos</div><span class="mu">' + esc(p.outros.join(', ')) + '</span></div><button class="btn sec pq" data-cmo="' + C.id + '">− 1</button><div class="ct">' + p.outros.length + '</div></div>' : '')
        + '<div class="mu" style="margin-top:8px">Contadas no passo 1: ' + tf + ' · etiquetas bipadas: ' + te + '</div>'
        + '<div class="lin"><button class="btn ok" data-creg="' + C.id + '">Registrar contagem</button><button class="btn sec" data-cvolta="' + C.id + '" style="flex:0 0 auto">Voltar ao passo 1</button></div>';
    }
    return h + '</div>';
  }).join('');
}
function contPorId(id) { return EST.contar.filter(function (c) { return c.id == id; })[0]; }
// Contagem pela peça × etiquetas, tamanho a tamanho (v2.4): o que não bate volta para uma recontagem antes de registrar.
function divContagem(C, p) {
  var o = C.grade.filter(function (g) { return (p.fis[g.sku] || 0) != (p.eti[g.sku] || 0); }).map(function (g) { return { g: g }; });
  if (p.outros.length) o.push({ outros: true });
  return o;
}
// v2.5: venda depois do saldo, lida do item da boleta (o código é o mesmo da etiqueta)
function lidoVenda(C, code) {
  var p = progC(C); if (p.passo != 4) return;
  var g = C.grade.filter(function (x) { return casa(code, x.sku); })[0];
  if (!g) { bip(false); fb('NÃO É DESTA COR', 'Esse item da boleta é de outro produto: não entra nesta contagem.', 'av'); return; }
  p.ven = p.ven || {}; p.ven[g.sku] = (p.ven[g.sku] || 0) + 1; lsSet('cont_' + C.id, p); bip(true);
  fb('+1 vendida · ' + g.tamanho, g.cor + ' — ' + p.ven[g.sku] + ' vendida(s)', 'ok'); if (!SCAN) render();
}

function fm(id) { var x = lsGet('fm_' + id) || {}; x.q = x.q || {}; x.outros = x.outros || {}; x.info = x.info || {}; return x; }
function fmSet(id, x) { lsSet('fm_' + id, x); }
function fTot(x) { return somaObj(x.q) + somaObj(x.outros); }
function fNorm(c) { return String(c || '').replace(/\D/g, '').replace(/^0+/, ''); }
function fProdCache() { return lsGet('fprod') || {}; }
function fApi(acao_, dados) { return api(acao_, Object.assign({ quem: fQuem(), dev: fDev() }, dados || {})); }
function fAcao(nome, dados, msgOk) { return acao(nome, Object.assign({ quem: fQuem(), dev: fDev() }, dados || {}), msgOk); }

function abasForn() {

}

  if (!fQuem()) {
    $('abas').hidden = !FORN_ADM; if (FORN_ADM) $('abas').innerHTML = '<button data-ab="painel">← Painel</button>'; // vista do painel: dá para voltar

  $('abas').innerHTML = (FORN_ADM ? '<button data-ab="painel">← Painel</button>' : '') + ab.map(function (a) { return '<button data-ab="' + a[0] + '" class="' + (FABA == a[0] ? 'on' : '') + '">' + a[1] + (a[2] ? '<span class="n">' + a[2] + '</span>' : '') + '</button>'; }).join('');

// ----- Contagem por referência -----
function fGrade(id) { if (FGRADE[id]) return FGRADE[id]; var g = lsGet('fg_' + id); if (g) FGRADE[id] = g; return g; }
function hFContagem() {
  var M = fAtivo('contagem');

    if (!g) { fApi('grade', { mov: M.id }).then(function (o) { FGRADE[M.id] = o.grade; lsSet('fg_' + M.id, o.grade); render(); }).catch(function (e) { toast(e.message, 'er'); }); return '<div class="card"><div class="vazio">Carregando a grade…</div></div>'; }
    if (M.modo == 'dupla') return hFDupla(M, g);
    var x = fm(M.id), tot = fTot(x), d = (g[0] || {}).descricao || '';
    var outrosCel = (M.enviados || []).filter(function (e) { return e.pecas; });
    var h = '<div class="card"><h2>Contando a referência ' + esc(M.ref) + ' <span class="pill">rápida</span></h2><div class="mu">' + esc(d) + ' · aberta por ' + esc(M.aberto_por) + ' em ' + dt(M.aberto_em) + ' ' + esc(String(M.aberto_em).slice(11, 16)) + '</div>'
      + '<div class="aviso av" style="margin-top:10px"><b>Conte a referência inteira:</b> todas as cores e tamanhos, em todo o depósito. Bipe uma peça e digite quantas há no pacote. Cor ou tamanho sem peça fica com saldo 0. Enquanto a contagem estiver aberta, ninguém dá entrada nem saída desta referência.</div>'
      + (outrosCel.length ? '<div class="aviso ok">Outros celulares já mandaram: ' + outrosCel.map(function (e) { return esc(e.quem) + ' (' + e.pecas + ' peças)'; }).join(', ') + '. Quem concluir soma tudo.</div>' : '')
      + '<div class="lin"><button class="btn" data-fbipar="contagem">📷 Bipar etiqueta</button></div>'
      + '<div class="lin"><input data-fcod="contagem" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
      + g.map(function (it) { var k = fNorm(it.sku), n = x.q[k] || 0; return '<div class="item"><div class="nm"><div class="ds">' + esc(it.cor) + '</div><span class="tam">' + esc(it.tamanho) + '</span></div><button class="btn sec pq" data-fcm="' + k + '">−</button><input data-fqtd="' + k + '" inputmode="numeric" value="' + n + '" style="width:76px;min-height:40px;text-align:center;font-weight:700"><button class="btn sec pq" data-fcp="' + k + '">+</button></div>'; }).join('')
      + (Object.keys(x.outros).length ? '<h3>Códigos sem cadastro</h3><div class="mu">Ficam registrados à parte, com a marca.</div>' + Object.keys(x.outros).map(function (k) { return '<div class="item"><div class="nm"><div class="ds">' + esc(k) + '</div></div><button class="btn sec pq" data-fom="' + k + '">− 1</button><div class="ct">' + x.outros[k] + '</div></div>'; }).join('') : '')
      + '<div class="mu" style="margin-top:8px"><b>Total contado neste celular: ' + tot + (tot == 1 ? ' peça' : ' peças') + '</b></div>'
      + '<div class="lin"><button class="btn ok" data-fconcluir="contagem">Concluir contagem</button></div>'
      + '<div class="lin"><button class="btn sec" data-fparte="contagem">Enviar o que contei (outra pessoa conclui)</button><button class="btn sec" data-fcancel="contagem" style="flex:0 0 auto">Cancelar</button></div></div>';

    + '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--tx);margin:6px 0"><input type="radio" name="fmodo" value="rapida" style="width:22px;min-height:22px;margin-top:2px"><span><b>Rápida</b><br><span class="mu">Bipa uma peça e digita a quantidade do pacote. Para pacote fechado de fábrica.</span></span></label>'
    + '<label>Referência</label><div class="lin" style="margin-top:0"><input data-fref="1" placeholder="ex.: 0395"><button class="btn" data-fabrirc="1" style="flex:0 0 auto">Abrir contagem</button></div>'
    + '<div class="lin"><button class="btn sec" data-fabrircam="1">📷 Ou bipe uma peça da referência</button></div></div>';
  if (ab.length) h2 += '<div class="card"><h2>Contagens abertas</h2>' + ab.map(function (m) { return '<div class="item"><div class="nm"><div class="ds">Referência ' + esc(m.ref) + ' <span class="pill">' + (m.modo == 'dupla' ? 'dupla' : 'rápida') + '</span></div><div class="mu">Aberta por ' + esc(m.aberto_por) + ' em ' + dt(m.aberto_em) + '</div></div><button class="btn sec pq" data-fadota="contagem|' + m.id + '">Contar neste celular</button></div>'; }).join('') + '</div>';
  h2 += hFUltimos();

}
function fModo() { var r = document.querySelector('input[name=fmodo]:checked'); return r ? r.value : 'dupla'; }
function fAbrirContagem(dados) {

}
// v2.9 — contagem dupla (como nas lojas): passo 1 pela peça (digita), passo 2 bipa cada etiqueta, passo 3 reconta só o que não bateu.
function fDif(g, x) { return g.filter(function (it) { var k = fNorm(it.sku); return (x.q[k] || 0) != ((x.eti || {})[k] || 0); }); }

  var tf = somaObj(x.q), te = somaObj(x.eti) + somaObj(x.etiOutros), d = (g[0] || {}).descricao || '';
  var outrosCel = (M.enviados || []).filter(function (e) { return e.pecas; });
  var linhaFis = function (it) { var k = fNorm(it.sku), n = x.q[k] || 0; return '<div class="item"><div class="nm"><div class="ds">' + esc(it.cor) + '</div><span class="tam">' + esc(it.tamanho) + '</span></div><button class="btn sec pq" data-fcm="' + k + '">−</button><input data-fqtd="' + k + '" inputmode="numeric" value="' + n + '" style="width:76px;min-height:40px;text-align:center;font-weight:700"><button class="btn sec pq" data-fcp="' + k + '">+</button></div>'; };

      + (recontar ? '<div class="lin" style="margin-top:6px"><span class="mu">Pela peça:</span><button class="btn sec pq" data-fcm="' + k + '">−</button><b>' + n + '</b><button class="btn sec pq" data-fcp="' + k + '">+</button></div>' : '<div class="mu">Pela peça: ' + n + '</div>')
      + '</div>' + (ne ? '<button class="btn sec pq" data-fem="' + k + '">− 1</button>' : '') + '<div class="ct">' + ne + '</div></div>';
  };
  var h = '<div class="card"><h2>Contando a referência ' + esc(M.ref) + ' <span class="pill">dupla</span></h2><div class="mu">' + esc(d) + ' · aberta por ' + esc(M.aberto_por) + ' em ' + dt(M.aberto_em) + ' ' + esc(String(M.aberto_em).slice(11, 16)) + '. Conte a referência inteira, em todo o depósito. Enquanto a contagem estiver aberta, ninguém dá entrada nem saída desta referência.</div>'
    + (outrosCel.length ? '<div class="aviso ok" style="margin-top:8px">Outros celulares já mandaram: ' + outrosCel.map(function (e) { return esc(e.quem) + ' (' + e.pecas + ')'; }).join(', ') + '. Quem concluir soma tudo.</div>' : '');
  if (passo == 1) {
    h += '<div class="aviso av" style="margin-top:10px"><b>Passo 1 de 2 · Contagem pela peça.</b> Pegue cada peça, olhe a cor e o tamanho da própria roupa e digite quantas tem de cada. <b>Não bipe agora.</b> Cor ou tamanho sem peça fica com 0.</div>'
      + g.map(linhaFis).join('')
      + '<div class="lin"><button class="btn" data-fpasso2="1">Concluir a contagem pela peça (' + tf + (tf == 1 ? ' peça' : ' peças') + ')</button></div>';
  } else if (passo == 3) {
    var dv = fDif(g, x);
    h += '<div class="aviso er" style="margin-top:10px"><b>Conferir antes de registrar.</b> A contagem pela peça e as etiquetas não bateram nos tamanhos abaixo. Reconte só esses: olhe o tamanho na roupa e na etiqueta e corrija.</div>'
      + dv.map(function (it) { return linhaEti(it, true); }).join('')
      + hFEtiOutros(x)
      + '<div class="lin"><button class="btn" data-fbipar="contagem">📷 Bipar etiqueta</button></div>'
      + '<div class="lin"><input data-fcod="contagem" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
      + (dv.length ? '<div class="aviso av" style="margin-top:8px">Se a diferença continuar, a peça está com a etiqueta errada: separe essas peças para trocar a etiqueta e registre assim mesmo. O saldo fica o contado pela peça.</div>' : '<div class="aviso ok" style="margin-top:8px">Agora bateu tudo.</div>')
      + '<div class="lin"><button class="btn ok" data-freg="1">Registrar contagem</button></div>';
  } else {
    h += '<div class="aviso ok" style="margin-top:10px">Passo 1 concluído: ' + tf + (tf == 1 ? ' peça contada.' : ' peças contadas.') + '</div><div class="aviso av"><b>Passo 2 de 2 · Bipagem.</b> Agora bipe a etiqueta de cada peça contada, uma a uma.</div>'
      + '<div class="lin"><button class="btn" data-fbipar="contagem">📷 Bipar etiquetas</button></div>'
      + '<div class="lin"><input data-fcod="contagem" inputmode="numeric" placeholder="ou digite o código e Enter"></div>'
      + g.map(function (it) { return linhaEti(it, false); }).join('')
      + hFEtiOutros(x)
      + '<div class="mu" style="margin-top:8px">Contadas no passo 1: ' + tf + ' · etiquetas bipadas: ' + te + '</div>'
      + '<div class="lin"><button class="btn ok" data-freg="1">Registrar contagem</button><button class="btn sec" data-fvolta1="1" style="flex:0 0 auto">Voltar ao passo 1</button></div>';

}
function hFEtiOutros(x) {
  var k = Object.keys(x.etiOutros || {}); if (!k.length) return '';
  return '<h3>Etiquetas de outros produtos</h3><div class="mu">Pode ser etiqueta trocada: separe essas peças.</div>' + k.map(function (c) { return '<div class="item"><div class="nm"><div class="ds">' + esc(c) + '</div></div><button class="btn sec pq" data-feo="' + c + '">− 1</button><div class="ct">' + x.etiOutros[c] + '</div></div>'; }).join('');
}
function lidoFContagem(code) {
  var M = fAtivo('contagem'); if (!M) return; var g = fGrade(M.id) || [], x = fm(M.id);
  if (M.modo == 'dupla') {
    x.eti = x.eti || {}; x.etiOutros = x.etiOutros || {};
    if ((x.passo || 1) == 1) { bip(false); fb('PASSO 1: NÃO BIPE', 'Primeiro conte pela peça e digite as quantidades. A bipagem é o passo 2.', 'av'); return; }
    var e = g.filter(function (i) { return casa(code, i.sku); })[0];
    if (e) { var ke = fNorm(e.sku); x.eti[ke] = (x.eti[ke] || 0) + 1; fmSet(M.id, x); var ok = x.eti[ke] <= (x.q[ke] || 0); bip(ok); fb((ok ? '+1 · ' : 'A MAIS · ') + e.cor + ' ' + e.tamanho, 'Etiquetas: ' + x.eti[ke] + ' de ' + (x.q[ke] || 0) + ' contadas pela peça.', ok ? 'ok' : 'av'); if (!SCAN) render(); return; }
    var c0 = fNorm(code); x.etiOutros[c0] = (x.etiOutros[c0] || 0) + 1; fmSet(M.id, x); bip(false); fb('ETIQUETA DE OUTRO PRODUTO', 'Registrada. Pode ser etiqueta trocada: separe a peça.', 'av'); if (!SCAN) render(); return;
  }
  var it = g.filter(function (i) { return casa(code, i.sku); })[0];
  if (it) { var k = fNorm(it.sku); x.q[k] = (x.q[k] || 0) + 1; fmSet(M.id, x); bip(true); fb('+1 · ' + it.cor + ' ' + it.tamanho, 'Agora: ' + x.q[k] + '. Digite a quantidade do pacote se for o caso.', 'ok'); if (!SCAN) { render(); var inp = document.querySelector('[data-fqtd="' + k + '"]'); inp && inp.select(); } return; }
  fb('Consultando…', '', '');
  fProduto(code).then(function (p) {
    if (p.achou) { bip(false); fb('NÃO É DESTA REFERÊNCIA', p.descricao + ' ' + p.cor + ' ' + p.tamanho + ' é da referência ' + p.ref + ': não entra nesta contagem.', 'er'); return; }
    var c = fNorm(code), y = fm(M.id); y.outros[c] = (y.outros[c] || 0) + 1; fmSet(M.id, y); bip(false); fb('CÓDIGO SEM CADASTRO', 'Registrado à parte, com a marca. Separe a peça.', 'av'); if (!SCAN) render();
  });
}

// ----- Entrada, saída e devolução (peça a peça) -----
var DICA_F = { entrada: 'Bipe cada peça que chegou da produção, já etiquetada.', saida: 'Bipe cada peça que vai na nota. No fim, digite o número da nota.', devolucao: 'Bipe só peça boa, apta para venda. Peça com defeito não entra.' };

      }).join('');
    }).join('')
    + (Object.keys(x.outros).length ? '<h3>Códigos sem cadastro</h3>' + Object.keys(x.outros).map(function (k) { return '<div class="item"><div class="nm"><div class="ds">' + esc(k) + '</div><span class="pill av">sem cadastro</span></div><button class="btn sec pq" data-fom="' + k + '">− 1</button><div class="ct">' + x.outros[k] + '</div></div>'; }).join('') : '')

function ordTamF(t) { return typeof ordTam === 'function' ? ordTam(t) : ['RN', 'PP', 'P', 'M', 'G', 'GG', '01', '02', '03', '04', '06', '08', '10', '12', '14', '16', 'U'].indexOf(String(t).toUpperCase()) + 100 + String(t); }
// Consulta do produto pelo código: guarda no celular (a mesma peça bipada de novo não consulta outra vez).
function fProduto(code) {
  var k = fNorm(code), c = fProdCache();
  if (c[k]) return Promise.resolve(c[k]);
  return fApi('produto', { codigo: code }).then(function (o) { var p = o.produto || { achou: false }; c = fProdCache(); c[k] = p; if (p.achou) c[fNorm(p.sku)] = p; lsSet('fprod', c); return p; })
    .catch(function (e) { return { erro: e.message }; });
}
// Leitor rápido (Bluetooth/USB) bipa mais rápido do que a consulta: fila, uma peça de cada vez, na ordem.
function lidoFMov(tipo, code) { FFILA.push([tipo, code]); fProcessa(); }
function fProcessa() {
  if (FPROC || !FFILA.length) return; FPROC = true;
  var it = FFILA.shift(), tipo = it[0], code = it[1], M = fAtivo(tipo);
  if (!M) { FPROC = false; return fProcessa(); }
  fProduto(code).then(function (p) {
    var x = fm(M.id);
    if (p.erro) { bip(false); fb('NÃO CONSEGUI CONSULTAR', 'Sem conexão? Bipe esta peça de novo. (' + p.erro + ')', 'er'); }
    else if (!p.achou) { var c = fNorm(code); x.outros[c] = (x.outros[c] || 0) + 1; fmSet(M.id, x); bip(false); fb('CÓDIGO SEM CADASTRO', 'Registrado com a marca: ' + c + '.', 'av'); }
    else if (EST.travadas.indexOf(String(p.ref)) >= 0) { bip(false); fb('REFERÊNCIA EM CONTAGEM', 'A ' + p.ref + ' está sendo contada: separe esta peça e bipe depois que a contagem acabar.', 'er'); }
    else {
      var k = fNorm(p.sku); x.q[k] = (x.q[k] || 0) + 1; x.info[k] = { ref: p.ref, d: p.descricao, c: p.cor, t: p.tamanho, sit: p.do_fornecedor === false ? 'outro' : 'ok' }; fmSet(M.id, x);
      if (p.do_fornecedor === false) { bip(false); fb('PEÇA DE OUTRO FORNECEDOR', p.descricao + ' ' + p.cor + ' ' + p.tamanho + ': registrada com a marca.', 'av'); }
      else { bip(true); fb('OK · ' + p.tamanho, p.descricao + ' ' + p.cor + ' — ' + x.q[k] + (x.q[k] == 1 ? ' peça' : ' peças'), 'ok'); }
    }
    FPROC = false; if (!SCAN && !FFILA.length) render(); fProcessa();
  });
}

// ----- Meu estoque -----
function hFEstoque() {
  var r = EST.resumo || {};
  var h = '<div class="card"><h2>Meu estoque</h2><div class="mu">' + pl(r.pecas, 'peça', 'peças') + ' em ' + pl(r.skus, 'código', 'códigos') + ', ' + (r.refs == 1 ? 'na referência já contada' : 'nas ' + r.refs + ' referências já contadas') + '.' + (r.refsSem ? ' ' + pl(r.refsSem, 'referência', 'referências') + ' com movimento e ainda sem contagem.' : '') + '</div>'
    + '<label>Referência</label><div class="lin" style="margin-top:0"><input data-fbusca="1" placeholder="referência ou código" value="' + esc(FSTQ ? FSTQ.ref : '') + '"><button class="btn" data-fbus="1" style="flex:0 0 auto">Ver</button><button class="btn sec" data-fbuscam="1" style="flex:0 0 auto">📷</button></div></div>';
  if (FSTQ) {
    if (!FSTQ.achou) h += '<div class="card"><div class="aviso er">Referência ' + esc(FSTQ.ref) + ' não encontrada.</div></div>';
    else {
      var cores = [], tams = [], cel = {};
      FSTQ.linhas.forEach(function (l) { if (cores.indexOf(l.cor) < 0) cores.push(l.cor); if (tams.indexOf(l.tamanho) < 0) tams.push(l.tamanho); cel[l.cor + '|' + l.tamanho] = l; });
      tams.sort(function (a, b) { return ordTamF(a) < ordTamF(b) ? -1 : 1; });
      h += '<div class="card"><h2>Ref ' + esc(FSTQ.ref) + ' · ' + esc(FSTQ.descricao) + '</h2>'
        + (FSTQ.em_contagem ? '<div class="aviso av">Em contagem agora.</div>' : '')
        + (FSTQ.sem_saldo_inicial ? '<div class="aviso er"><b>Sem saldo inicial</b> em parte da grade: conte a referência para o saldo valer. Os números "—" ainda não têm contagem.</div>' : '<div class="mu">Contada em ' + dt(FSTQ.contada_em) + '.</div>')
        + '<div class="tabw"><table><tr><th>Cor</th>' + tams.map(function (t) { return '<th>' + esc(t) + '</th>'; }).join('') + '</tr>'
        + cores.map(function (c) { return '<tr><td>' + esc(c) + '</td>' + tams.map(function (t) { var l = cel[c + '|' + t]; return '<td>' + (!l ? '' : (l.saldo == null ? '—' : (l.saldo < 0 ? '<span class="pill er">' + l.saldo + '</span>' : '<b>' + l.saldo + '</b>'))) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>'
        + (FSTQ.historico.length ? '<h3>Movimentos dos últimos 30 dias</h3><div class="tabw"><table><tr><th>Data</th><th>Movimento</th><th>Cor · tam.</th><th>Qtd</th></tr>' + FSTQ.historico.map(function (m) {
          return '<tr><td>' + dt(m.quando) + '</td><td>' + esc(m.rotulo) + (m.nf ? ' · NF ' + esc(m.nf) : '') + (m.destino ? ' · ' + esc(m.destino) : '') + (m.estornado ? ' <span class="pill av">estornado</span>' : '') + '</td><td>' + esc(m.cor + ' ' + m.tamanho) + '</td><td>' + (m.tipo == 'contagem' ? '= ' : (m.qtd > 0 ? '+' : '')) + m.qtd + '</td></tr>'; }).join('') + '</table></div>' : '')
        + '</div>';
    }
  }
  return h + hFUltimos();
}
function fBuscar(txt) { txt = String(txt || '').trim(); if (!txt) return; var dig = txt.replace(/\D/g, ''); var d = dig.length >= 8 ? { codigo: txt } : { ref: txt }; return fApi('estoque', d).then(function (o) { FSTQ = o.estoque; render(); }).catch(function (e) { toast(e.message, 'er'); }); }
function hFUltimos() {
  var u = EST.ultimos || []; if (!u.length) return '';
  return '<div class="card"><details><summary>Últimos movimentos concluídos</summary><div class="tabw"><table><tr><th>Quando</th><th>Movimento</th><th>Peças</th><th>Quem</th></tr>' + u.map(function (m) {
    return '<tr><td>' + dt(m.concluido_em) + ' ' + esc(String(m.concluido_em).slice(11, 16)) + '</td><td>' + esc(m.rotulo) + (m.ref ? ' · ref ' + esc(m.ref) : '') + (m.nf ? ' · NF ' + esc(m.nf) : '') + (m.destino_nome ? ' · ' + esc(m.destino_nome) : '') + '</td><td>' + m.pecas + '</td><td>' + esc(m.quem) + '</td></tr>'; }).join('') + '</table></div></details></div>';
}

// ----- cliques e teclas do fornecedor -----
$('conteudo').addEventListener('click', function (e) {
  if (!EST || EST.modo != 'fornecedor') return; var b = e.target.closest('button'); if (!b) return; var d = b.dataset;
  if (d.fnomeok) { var nm = document.querySelector('[data-fnome]').value.trim(); if (!nm) { toast('Digite seu nome.', 'er'); return; } lsSet('f_quem', nm); return render(); }
  if (d.ftroca) { lsSet('f_quem', null); return render(); }
  if (d.fabrirc) { var rf = document.querySelector('[data-fref]').value.trim(); if (!rf) { toast('Digite a referência.', 'er'); return; } return fAbrirContagem({ ref: rf }); }
  if (d.fabrircam) return abreScanner(function (c) { fechaScanner(); fAbrirContagem({ codigo: c }); });
  if (d.fadota) { var ka = d.fadota.split('|'); fSetAtivo(ka[0], ka[1]); return render(); }
  if (d.fabrir) { var ds = document.querySelector('[data-fdest]'), dv = ds ? ds.value : ''; if (d.fabrir == 'saida' && !dv) { toast('Escolha a loja de destino.', 'er'); return; } return fAcao('abrir', { tipo: d.fabrir, destino: dv }).then(function (o) { if (o && o.mov) { fSetAtivo(d.fabrir, o.mov.id); render(); } }); }
  if (d.fbipar) { var tp = d.fbipar; return abreScanner(function (c) { if (tp == 'contagem') lidoFContagem(c); else lidoFMov(tp, c); }); }
  if (d.fcp || d.fcm) { var Mc = fAtivo('contagem'), xc = fm(Mc.id), kc = d.fcp || d.fcm; xc.q[kc] = Math.max(0, (xc.q[kc] || 0) + (d.fcp ? 1 : -1)); if (!xc.q[kc]) delete xc.q[kc]; fmSet(Mc.id, xc); return render(); }
  if (d.fmenos || d.fom) { var tpm = FABA, Mm = fAtivo(tpm), xm = fm(Mm.id), campo = d.fmenos ? 'q' : 'outros', km = d.fmenos || d.fom; xm[campo][km] = (xm[campo][km] || 0) - 1; if (xm[campo][km] <= 0) delete xm[campo][km]; fmSet(Mm.id, xm); return render(); }
  if (d.fparte) { var Mp = fAtivo('contagem'), xp = fm(Mp.id); return fAcao('parte', { mov: Mp.id, q: xp.q, outros: xp.outros, eti: xp.eti || {}, etiOutros: xp.etiOutros || {} }); }
  if (d.fpasso2) { var M2 = fAtivo('contagem'), x2 = fm(M2.id); if (!confirm('Concluir a contagem pela peça com ' + somaObj(x2.q) + ' peça(s)? Depois você vai bipar as etiquetas.')) return; x2.passo = 2; fmSet(M2.id, x2); window.scrollTo(0, 0); return render(); }
  if (d.fvolta1) { var M1 = fAtivo('contagem'), x1 = fm(M1.id); x1.passo = 1; fmSet(M1.id, x1); return render(); }
  if (d.fem || d.feo) { var Me = fAtivo('contagem'), xe = fm(Me.id), ce = d.fem ? 'eti' : 'etiOutros', ke2 = d.fem || d.feo; xe[ce] = xe[ce] || {}; xe[ce][ke2] = (xe[ce][ke2] || 0) - 1; if (xe[ce][ke2] <= 0) delete xe[ce][ke2]; fmSet(Me.id, xe); return render(); }
  if (d.freg) {
    var Mr = fAtivo('contagem'), xr = fm(Mr.id), gr = fGrade(Mr.id) || [], dvr = fDif(gr, xr), passo = xr.passo || 1;
    if (dvr.length && passo == 2) { xr.passo = 3; fmSet(Mr.id, xr); window.scrollTo(0, 0); return render(); } // uma rodada de recontagem
    var oe = somaObj(xr.etiOutros || {});
    if ((dvr.length || oe) && !confirm('Ainda há diferença entre a peça e a etiqueta' + (dvr.length ? ' em ' + dvr.map(function (i) { return i.cor + ' ' + i.tamanho; }).join(', ') : '') + (oe ? ' e ' + oe + ' etiqueta(s) de outro produto' : '') + '. Registrar assim? O saldo fica o contado pela peça; separe as peças para trocar a etiqueta.')) return;
    if (!dvr.length && !oe && !confirm('Concluir a contagem da referência ' + Mr.ref + '? O saldo da referência passa a ser o contado.')) return;
    return fAcao('concluir', { mov: Mr.id, q: xr.q, outros: {}, eti: xr.eti || {}, etiOutros: xr.etiOutros || {} }).then(function (o) { if (o) { lsSet('fm_' + Mr.id, null); lsSet('fg_' + Mr.id, null); fSetAtivo('contagem', null); FSTQ = null; render(); } });
  }
  if (d.fcancel) {
    var Mx = fAtivo(d.fcancel); if (!Mx) return;
    if (!confirm('Cancelar? O que foi bipado neste movimento é descartado e nada entra no estoque.')) return;
    return fAcao('cancelar', { mov: Mx.id }).then(function (o) { if (o) { lsSet('fm_' + Mx.id, null); lsSet('fg_' + Mx.id, null); fSetAtivo(d.fcancel, null); render(); } });
  }
  if (d.fconcluir) {
    var tc = d.fconcluir, Mf = fAtivo(tc), xf = fm(Mf.id), nfi = document.querySelector('[data-fnf]'), nf = nfi ? nfi.value.trim() : '';
    if (tc == 'saida' && !nf) { toast('Digite o número da nota fiscal.', 'er'); nfi && nfi.focus(); return; }
    var pergunta = tc == 'contagem' ? 'Concluir a contagem da referência ' + Mf.ref + '? O saldo da referência passa a ser o contado' + (Mf.enviados && Mf.enviados.length ? ' (somando o que os outros celulares mandaram)' : '') + '. Cor ou tamanho sem peça fica com saldo 0.'
      : 'Concluir ' + FTIPOS[tc].toLowerCase() + ' com ' + fTot(xf) + ' peça(s)' + (nf ? ' na nota ' + nf : '') + '?';
    if (!confirm(pergunta)) return;
    return fAcao('concluir', { mov: Mf.id, q: xf.q, outros: xf.outros, nf: nf }).then(function (o) { if (o) { lsSet('fm_' + Mf.id, null); lsSet('fg_' + Mf.id, null); fSetAtivo(tc, null); FSTQ = null; render(); } });
  }
  if (d.fbus) return fBuscar(document.querySelector('[data-fbusca]').value);
  if (d.fbuscam) return abreScanner(function (c) { fechaScanner(); fBuscar(c); });
});
$('conteudo').addEventListener('change', function (e) {
  if (!EST || EST.modo != 'fornecedor') return; var t = e.target;
  if (t.dataset.fqtd) { var M = fAtivo('contagem'), x = fm(M.id), n = Math.max(0, parseInt(t.value, 10) || 0); if (n) x.q[t.dataset.fqtd] = n; else delete x.q[t.dataset.fqtd]; fmSet(M.id, x); render(); }
});
$('conteudo').addEventListener('keydown', function (e) {
  if (!EST || EST.modo != 'fornecedor' || e.key != 'Enter') return; var t = e.target, v = t.value.trim(); if (!v) return;
  if (t.dataset.fcod) { if (t.dataset.fcod == 'contagem') lidoFContagem(v); else lidoFMov(t.dataset.fcod, v); t.value = ''; var k = t.dataset.fcod; setTimeout(function () { var n = document.querySelector('[data-fcod="' + k + '"]'); n && n.focus(); }, 0); }
  if (t.dataset.fqtd) t.blur();
  if (t.dataset.fref) document.querySelector('[data-fabrirc]').click();
  if (t.dataset.fbusca) fBuscar(v);
  if (t.dataset.fnome) document.querySelector('[data-fnomeok]').click();
});

// ----- Quadro "Estoque do fornecedor" no painel do Raphael -----
function pl(n, s, p) { return n + ' ' + (n == 1 ? s : p); }
function hFornPainel(p) {
  return (p.fornecedores || []).map(function (F) {
    var r = F.resumo || {}, fx = F.fluxo || {};
    var h = '<div class="card"><h2>Estoque da ' + esc(F.nome) + '</h2>'
      + (F.semMovimento ? '<div class="aviso er">Sem movimento há 7 dias ou mais' + (F.ultimo ? ' (último em ' + dt(F.ultimo) + ')' : '') + '. A MX está bipando?</div>' : '')
      + '<div class="mu">' + pl(r.pecas, 'peça', 'peças') + ' em ' + pl(r.skus, 'código', 'códigos') + ' · ' + pl(r.refs, 'referência contada', 'referências contadas') + ' · ' + pl(r.refsSem, 'com movimento e ainda sem contagem', 'com movimento e ainda sem contagem') + (F.ultimo ? ' · último movimento ' + dt(F.ultimo) : '') + '.' + (r.pecas ? ' Das ' + pl(r.pecas, 'peça', 'peças') + ', ' + (r.pecasDupla || 0) + ' vêm de contagem dupla (conferida pela bipagem).' : '') + '</div>'
      + '<div class="mu">Entradas: ' + fx.entradas7 + ' peças em 7 dias, ' + fx.entradas30 + ' em 30 · Saídas: ' + fx.saidas7 + ' em 7 dias, ' + fx.saidas30 + ' em 30 · Devoluções 30 dias: ' + fx.devolucoes30 + '.</div>'
      + '<div class="lin"><button class="btn sec" data-fver="' + esc(F.id) + '">Ver como a ' + esc(F.nome) + '</button><a class="btn sec" href="' + esc(F.planilha) + '" target="_blank">Planilha</a></div>';
    if (F.abertos.length) h += '<h3>Abertos agora</h3>' + F.abertos.map(function (m) { return '<div class="mu" style="padding:3px 0">' + esc(m.rotulo) + (m.ref ? ' ref ' + esc(m.ref) : '') + (m.destino_nome ? ' · ' + esc(m.destino_nome) : '') + ' · ' + esc(m.aberto_por) + ' · desde ' + dt(m.aberto_em) + (m.parado ? ' <span class="pill er">parado há ' + m.dias + ' dias</span>' : '') + '</div>'; }).join('');
    var al = '';
    if (F.negativos.length) al += '<details open><summary><span class="pill er">' + F.negativos.length + '</span> código(s) com saldo negativo</summary><div class="mu">Saiu mais do que foi contado: conte a referência de novo.</div>' + F.negativos.map(function (x) { return '<div class="mu">Ref ' + esc(x.ref) + ' ' + esc(x.descricao + ' ' + x.cor + ' ' + x.tamanho) + ': ' + x.saldo + '</div>'; }).join('') + '</details>';
    if (F.semCadastro.length) al += '<details><summary><span class="pill av">' + F.semCadastro.length + '</span> código(s) sem cadastro</summary><div class="mu">Peça bipada que o cadastro não conhece: cadastrar ou corrigir a etiqueta.</div>' + F.semCadastro.map(function (x) { return '<div class="mu">' + esc(x.codigo) + (x.saldo != null ? ' · contado ' + x.saldo : '') + (x.entradas ? ' · entrou ' + x.entradas : '') + (x.saidas ? ' · saiu ' + x.saidas : '') + '</div>'; }).join('') + '</details>';
    if ((F.etiquetaTrocar || []).length) al += '<details open><summary><span class="pill er">' + F.etiquetaTrocar.length + '</span> tamanho(s) com etiqueta a trocar</summary><div class="mu">Na contagem dupla, a peça e a etiqueta não bateram nem na recontagem. O saldo ficou o contado pela peça; a MX deve trocar a etiqueta e recontar a referência.</div>' + F.etiquetaTrocar.map(function (x) { return '<div class="mu">Ref ' + esc(x.ref) + ' ' + esc(x.descricao + ' ' + x.cor + ' ' + x.tamanho) + ' · contada em ' + dt(x.contada_em) + '</div>'; }).join('') + '</details>';
    if (F.outroFornecedor.length) al += '<details><summary><span class="pill av">' + F.outroFornecedor.length + '</span> peça(s) de outro fornecedor</summary>' + F.outroFornecedor.map(function (x) { return '<div class="mu">' + esc(x.sku) + ' · ref ' + esc(x.ref) + ' ' + esc(x.descricao + ' ' + x.cor + ' ' + x.tamanho) + '</div>'; }).join('') + '</details>';
    h += al ? '<h3>Alertas</h3>' + al : '';
    h += '<details><summary>Movimentos dos últimos 30 dias (' + F.movimentos.length + ')</summary><div class="tabw"><table><tr><th>Quando</th><th>Movimento</th><th>Peças</th><th></th></tr>' + F.movimentos.map(function (m) {
      return '<tr><td>' + dt(m.concluido_em) + '</td><td>' + esc(m.rotulo) + (m.ref ? ' ref ' + esc(m.ref) : '') + (m.modo ? ' <span class="pill">' + (m.modo == 'dupla' ? 'dupla' : 'rápida') + '</span>' : '') + (m.difEtiqueta ? ' <span class="pill er">' + m.difEtiqueta + ' etiqueta(s) a trocar</span>' : '') + (m.etiOutras ? ' <span class="pill av">' + m.etiOutras + ' etiqueta(s) de outro produto</span>' : '') + (m.nf ? ' · NF ' + esc(m.nf) : '') + (m.destino_nome ? ' · ' + esc(m.destino_nome) : '') + '<div class="mu">' + esc(m.quem) + '</div>' + (m.situacao == 'estornado' ? '<div class="mu">' + esc(m.obs) + '</div>' : '') + '</td><td>' + m.pecas + '</td><td>'
        + (m.situacao == 'estornado' ? '<span class="pill av">estornado</span>' : (m.tipo != 'contagem' ? '<button class="btn sec pq" data-festorn="' + esc(F.id) + '|' + m.id + '">Estornar</button>' : '')) + '</td></tr>'; }).join('') + '</table></div></details></div>';
    return h;
  }).join('');
}

function carrega() {
  if (!TOK) { $('titulo').textContent = 'Link incompleto'; $('conteudo').innerHTML = '<div class="card"><div class="vazio">Abra o link da sua loja.</div></div>'; return; }
  api('estado').then(function (o) { EST = o.estado || null; PAINEL = o.painel || null; FRANQ = o.franq || null; render(); })
    .catch(function (e) { $('titulo').textContent = 'Não carregou'; $('conteudo').innerHTML = '<div class="card"><div class="aviso er">' + esc(e.message) + '</div><button class="btn" onclick="carrega()">Tentar de novo</button></div>'; });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && !SCAN && !OCUP) carrega(); });
carrega();
</script>
